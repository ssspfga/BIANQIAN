<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<title>便签</title>
<style>
  :root{
    --bg:#eef1f6;
    --card:#ffffff;
    --text:#1b1f27;
    --muted:#8b94a6;
    --line:#e9edf4;
    --soft:#f5f7fb;
    --accent:#2f7cf6;
    --danger:#ef4b4b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,"Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;
    height:100%;
    padding:0;
  }
  .appbody{
    flex:1;min-height:0;
    display:flex;align-items:center;justify-content:center;
    padding:14px;
  }
  html.desktop .appbody{padding:0 12px 12px}
  [hidden]{display:none !important}

  /* 收起后的细条 */
  html.collapsed,html.collapsed body{background:#2f7cf6}
  html.collapsed .winbar,html.collapsed .appbody{display:none}

  /* 无边框窗口顶部拖动条 */
  .winbar{
    flex:none;height:32px;display:flex;align-items:center;gap:2px;
    padding:0 8px 0 6px;
    -webkit-app-region:drag;user-select:none;
  }
  .winbar .spacer{flex:1}
  .winbar .wtitle{font-size:11.5px;color:#9aa3b3;letter-spacing:.5px}
  .winbtn{
    -webkit-app-region:no-drag;
    width:30px;height:26px;flex:none;
    border:none;background:transparent;border-radius:8px;
    color:#7a8496;display:grid;place-items:center;cursor:pointer;
    transition:background .13s,color .13s;
  }
  .winbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .winbtn:hover{background:#e2e8f3;color:#2f3a4d}
  .winbtn.close:hover{background:#ef4b4b;color:#fff}
  .winbtn.active{color:var(--accent);background:#e6efff}

  .card{
    position:relative;
    width:min(540px,100%);
    height:min(820px,100%);
    background:var(--card);
    border-radius:22px;
    box-shadow:0 18px 50px rgba(26,36,56,.14),0 2px 6px rgba(26,36,56,.06);
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  /* ---------- 顶栏 ---------- */
  .bar{display:flex;align-items:center;gap:6px;padding:10px 10px 6px;flex:none}
  html.desktop .bar{-webkit-app-region:drag}
  html.desktop .bar .icon-btn{-webkit-app-region:no-drag}
  html.desktop .newrow,html.desktop .list,html.desktop .foot{-webkit-app-region:no-drag}
  .icon-btn{
    position:relative;width:40px;height:40px;flex:none;
    border:none;border-radius:14px;background:transparent;
    color:#606a7d;display:grid;place-items:center;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .icon-btn:hover{background:var(--soft);color:var(--accent)}
  .icon-btn:active{background:#eef2f9}
  .icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .brand{
    flex:1;text-align:center;font-size:16.5px;font-weight:700;letter-spacing:.5px;
    display:flex;align-items:baseline;justify-content:center;gap:7px;
  }
  .brand .sub{font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}
  .badge{display:none}

  /* ---------- 新建行 ---------- */
  .newrow{
    display:flex;align-items:center;gap:10px;
    margin:4px 14px 10px;padding:7px 8px 7px 9px;
    background:#fff;border:1px solid var(--line);border-radius:15px;
    transition:border-color .15s,box-shadow .15s;flex:none;
  }
  .newrow:focus-within{border-color:rgba(47,124,246,.55);box-shadow:0 0 0 3px rgba(47,124,246,.10)}
  .plus{
    width:28px;height:28px;flex:none;border:none;border-radius:50%;
    background:#eef4ff;color:var(--accent);font-size:19px;line-height:1;
    display:grid;place-items:center;cursor:pointer;padding-bottom:2px;
    transition:background .15s,transform .1s;
  }
  .plus:hover{background:#e0ebff}
  .plus:active{transform:scale(.94)}
  #newInput{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px;color:inherit;font-family:inherit;padding:6px 0}
  #newInput::placeholder{color:#aeb6c4}

  /* ---------- 列表 ---------- */
  .list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 10px 10px}
  .list::-webkit-scrollbar{width:8px}
  .list::-webkit-scrollbar-thumb{background:#dfe4ee;border-radius:8px;border:2px solid #fff}

  .row{
    display:flex;align-items:flex-start;gap:10px;
    padding:11px 8px 11px 10px;border-radius:15px;
    transition:background .13s;
  }
  .row:hover{background:var(--soft)}
  .row.pinned{background:#f7faff}
  .row.pinned:hover{background:#f1f6ff}

  .check{
    width:22px;height:22px;flex:none;margin-top:1px;
    border-radius:50%;border:2px solid #cfd7e4;background:#fff;
    cursor:pointer;padding:0;position:relative;
    transition:border-color .13s,background .13s;
  }
  .check::after{
    content:"";position:absolute;left:5.5px;top:5px;
    width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;
    transform:rotate(-45deg);opacity:0;transition:opacity .12s;
  }
  .check:hover{border-color:var(--accent);background:var(--accent)}
  .check:hover::after{opacity:1}
  .check.done{border-color:var(--accent);background:var(--accent)}
  .check.done::after{opacity:1}
  .check.partial{border-color:var(--accent)}
  .check.partial::before{
    content:"";position:absolute;left:50%;top:50%;width:8px;height:2px;
    background:var(--accent);border-radius:1px;transform:translate(-50%,-50%);
  }

  .body{flex:1;min-width:0}
  .note-text{
    font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
    cursor:text;border-radius:8px;
  }
  .note-text.head{font-weight:600}
  .note-text:hover{background:#eef2f9}
  .note-time{font-size:11.5px;color:var(--muted);margin-top:5px}
  .note-time .tip{color:#9aa3b4}

  textarea.edit,.kedit{
    border:none;outline:none;resize:none;overflow:hidden;
    font-family:inherit;font-size:15px;line-height:1.55;color:inherit;
    background:#f4f7fc;border-radius:10px;padding:7px 10px;width:100%;
  }
  textarea.edit{min-height:44px}
  .kedit{font-size:14.5px;padding:5px 9px;background:#f7f9fd}

  /* ---------- 子项 ---------- */
  .kids{
    margin:7px 0 2px;padding-left:11px;
    border-left:2px solid #eef1f7;
    display:flex;flex-direction:column;gap:7px;
  }
  .kid{display:flex;align-items:flex-start;gap:8px}
  .kcheck{
    width:17px;height:17px;flex:none;margin-top:2px;
    border-radius:50%;border:2px solid #d3dae7;background:#fff;
    cursor:pointer;padding:0;position:relative;
    transition:border-color .13s,background .13s;
  }
  .kcheck::after{
    content:"";position:absolute;left:3.5px;top:3.6px;
    width:6px;height:3px;border-left:2px solid #fff;border-bottom:2px solid #fff;
    transform:rotate(-45deg);opacity:0;transition:opacity .12s;
  }
  .kcheck:hover{border-color:var(--accent);background:var(--accent)}
  .kcheck:hover::after{opacity:1}
  .kcheck.done{border-color:var(--accent);background:var(--accent)}
  .kcheck.done::after{opacity:1}
  .ktext{
    flex:1;min-width:0;font-size:14.5px;line-height:1.5;
    white-space:pre-wrap;word-break:break-word;cursor:text;border-radius:7px;
  }
  .ktext:hover{background:#eef2f9}
  .kid.done .ktext{color:#a6aebd;text-decoration:line-through}

  .pin{
    width:26px;height:26px;flex:none;margin-top:1px;
    border:none;background:transparent;border-radius:9px;
    color:#c3cad8;display:grid;place-items:center;cursor:pointer;
    transition:color .13s,background .13s;
  }
  .pin svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .row:hover .pin{color:#9aa4b6}
  .pin:hover{background:#e8eefb;color:var(--accent)}
  .pin.on{color:var(--accent)}
  .row:not(:hover) .pin:not(.on){opacity:.45}

  .empty{text-align:center;color:var(--muted);font-size:13.5px;line-height:1.8;padding:34px 26px;flex:1}

  /* ---------- 底部 ---------- */
  .foot{
    flex:none;display:flex;align-items:center;gap:8px;
    padding:7px 16px 11px;font-size:11.5px;color:var(--muted);
    border-top:1px solid var(--line);
  }
  .foot .spacer{flex:1}
  .foot button{border:none;background:transparent;color:var(--accent);font-size:11.5px;font-family:inherit;cursor:pointer;padding:2px 4px;border-radius:6px}
  .foot button:hover{background:#eef4ff}

  /* ---------- 面板 ---------- */
  .sheet{
    position:absolute;inset:0;background:#fff;z-index:20;
    display:flex;flex-direction:column;border-radius:22px;
    animation:sheetIn .16s ease-out;
  }
  @keyframes sheetIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sheet-head{display:flex;align-items:center;gap:8px;padding:10px 10px 6px;flex:none}
  .sheet-head .title{flex:1;text-align:center;font-size:15.5px;font-weight:700}
  .sheet-body{flex:1;overflow-y:auto;padding:4px 16px 16px}
  .sheet-foot{flex:none;display:flex;gap:10px;padding:10px 16px 16px;border-top:1px solid var(--line)}
  .sheet-foot.wrap{flex-wrap:wrap}

  .btn{
    flex:1;border:none;border-radius:13px;padding:12px 14px;
    font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
    background:var(--soft);color:#2a3140;transition:filter .13s,background .13s;
    min-width:96px;
  }
  .btn:hover{filter:brightness(.97)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.danger{background:#fdeeee;color:var(--danger)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  .trow{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .trow:last-child{border-bottom:none}
  .trow .t-text{font-size:14.5px;line-height:1.5;color:#5d6675;white-space:pre-wrap;word-break:break-word}
  .trow .t-time{font-size:11px;color:var(--muted);margin-top:3px}
  .mini{
    flex:none;border:none;background:var(--soft);border-radius:10px;
    font-family:inherit;font-size:12.5px;padding:7px 11px;cursor:pointer;color:#3b4457;
  }
  .mini:hover{background:#eaeef6}
  .mini.red{background:#fdeeee;color:var(--danger)}
  .mini.red:hover{background:#fbe0e0}

  .hint{font-size:12.5px;color:var(--muted);line-height:1.7;margin:2px 0 12px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12.5px;color:#66707f;margin-bottom:6px;font-weight:600}
  .field input[type=text],.field input[type=password]{
    width:100%;border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;font-size:14px;font-family:inherit;color:inherit;
    outline:none;background:#fff;transition:border-color .15s,box-shadow .15s;
  }
  .field input:focus{border-color:rgba(47,124,246,.55);box-shadow:0 0 0 3px rgba(47,124,246,.10)}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .switch-row span{font-size:14px}
  .switch{position:relative;width:46px;height:27px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch i{position:absolute;inset:0;border-radius:14px;background:#dde3ee;transition:background .16s}
  .switch i::after{
    content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .16s;
  }
  .switch input:checked + i{background:var(--accent)}
  .switch input:checked + i::after{transform:translateX(19px)}

  .sec-title{font-size:12.5px;color:#66707f;font-weight:700;margin:16px 0 8px;letter-spacing:.4px}
  .sync-state{margin:8px 0 10px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:12.5px;color:#5d6675;line-height:1.6;word-break:break-all}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn-row .btn{flex:1 1 30%}

  /* ---------- 冲突 ---------- */
  .cf{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .cf:last-child{border-bottom:none;padding-bottom:0}
  .cf-head{font-size:13.5px;font-weight:600;color:#3c4557;margin-bottom:8px}
  .cf-side{
    border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;
    cursor:pointer;margin-bottom:8px;transition:border-color .13s,background .13s;
  }
  .cf-side:hover{border-color:#cfdcf3}
  .cf-side.sel{border-color:var(--accent);background:#f5f9ff}
  .cf-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin-bottom:4px}
  .cf-side.sel .cf-label{color:var(--accent)}
  .cf-text{font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#464f60}
  .cf-time{font-size:11px;color:var(--muted);margin-top:5px}

  /* ---------- 提示条 ---------- */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
    background:#262c38;color:#fff;padding:10px 12px 10px 16px;border-radius:13px;
    font-size:13px;display:flex;align-items:center;gap:12px;
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
    z-index:60;max-width:calc(100% - 40px);
    box-shadow:0 10px 26px rgba(20,26,38,.28);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast .act{
    border:none;background:rgba(255,255,255,.14);color:#fff;
    font-family:inherit;font-size:12.5px;font-weight:600;
    padding:5px 10px;border-radius:9px;cursor:pointer;
  }
  .toast .act:hover{background:rgba(255,255,255,.24)}

  #textOut{
    width:100%;height:100%;min-height:300px;border:1px solid var(--line);
    border-radius:12px;padding:10px;font-family:Consolas,Menlo,monospace;
    font-size:12px;line-height:1.5;outline:none;resize:none;color:#414a5b;
  }

  @media (max-width:560px){
    body{padding:0}
    .appbody{padding:0}
    html.desktop .appbody{padding:0}
    .card{width:100%;height:100%;border-radius:0;box-shadow:none}
    .sheet{border-radius:0}
    .bar{padding-top:calc(10px + env(safe-area-inset-top))}
    .foot{padding-bottom:calc(11px + env(safe-area-inset-bottom))}
    .row:not(:hover) .pin:not(.on){opacity:.7}
  }
</style>
</head>
<body>
<div class="winbar" id="winbar" hidden>
  <button class="winbtn" id="btnWinPin" title="窗口置顶" aria-label="窗口置顶">
    <svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 3h6l-1 5 3.4 2.4a1 1 0 0 1 .43.83V13a1 1 0 0 1-1 1H7.17a1 1 0 0 1-1-1v-1.77a1 1 0 0 1 .43-.83L10 8 9 3z"/></svg>
  </button>
  <button class="winbtn" id="btnWinCollapse" title="贴到屏幕边缘收起" aria-label="收起">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M17 8.5v7"/><path d="M6.5 12h7"/><path d="M11 9.5l2.5 2.5-2.5 2.5"/></svg>
  </button>
  <span class="wtitle">便签</span>
  <div class="spacer"></div>
  <button class="winbtn" id="btnWinMin" title="最小化" aria-label="最小化">
    <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
  </button>
  <button class="winbtn close" id="btnWinClose" title="关闭" aria-label="关闭">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>

<div class="appbody">
<div class="card" id="card">

  <header class="bar">
    <button class="icon-btn" id="btnSettings" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div class="brand">便签<span class="sub" id="subtitle">本地</span></div>
    <button class="icon-btn" id="btnTrash" title="回收站" aria-label="回收站">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    </button>
  </header>

  <div class="newrow">
    <button class="plus" id="btnAdd" title="新建便签" aria-label="新建便签">+</button>
    <input id="newInput" type="text" placeholder="新建便签…（回车保存）" autocomplete="off" enterkeyhint="done">
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty">还没有便签<br>在上面那行写点什么，回车就创建了</div>

  <div class="foot">
    <span id="status">就绪</span>
    <span class="spacer"></span>
    <button id="btnQuickSync" hidden>同步</button>
  </div>

  <!-- 回收站 -->
  <section class="sheet" id="sheetTrash" hidden>
    <div class="sheet-head">
      <button class="icon-btn" id="btnCloseTrash" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title">回收站</div>
      <button class="icon-btn" id="btnEmptyTrash" title="清空回收站" aria-label="清空回收站">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <p class="hint" id="trashHint">点左边的勾取消打钩，便签会回到列表，状态重置为未完成。</p>
      <div id="trashList"></div>
    </div>
  </section>

  <!-- 设置 -->
  <section class="sheet" id="sheetSettings" hidden>
    <div class="sheet-head">
      <button class="icon-btn" id="btnCloseSettings" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title">设置</div>
      <div style="width:40px"></div>
    </div>
    <div class="sheet-body">
      <p class="hint">填 WebDAV 信息即可在 Windows 和安卓之间同步。坚果云：地址用 <b>https://dav.jianguoyun.com/dav/</b>，密码要用「账户信息 → 安全选项 → 添加应用密码」生成的，别用登录密码。</p>

      <div class="field">
        <label for="cfgUrl">服务器地址</label>
        <input id="cfgUrl" type="text" placeholder="https://dav.jianguoyun.com/dav/" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="cfgUser">账号（邮箱）</label>
        <input id="cfgUser" type="text" placeholder="you@example.com" autocomplete="username" spellcheck="false">
      </div>
      <div class="field">
        <label for="cfgPass">应用密码</label>
        <input id="cfgPass" type="password" placeholder="坚果云应用密码" autocomplete="current-password">
      </div>
      <div class="field">
        <label for="cfgFolder">同步目录</label>
        <input id="cfgFolder" type="text" placeholder="便签" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="cfgFile">文件名</label>
        <input id="cfgFile" type="text" placeholder="便签.json" autocomplete="off" spellcheck="false">
      </div>

      <div class="switch-row">
        <span>自动同步（改动后自动上传）</span>
        <label class="switch"><input type="checkbox" id="cfgAuto"><i></i></label>
      </div>

      <div id="winSettings" hidden>

          <span>贴到屏幕左右边缘自动收起，鼠标靠近再滑出</span>

          <span>开机自动启动（登录电脑后自动打开）</span>

      <div class="btn-row" id="rowBackupDir" style="margin-top:10px" hidden>
        <button class="btn" id="btnBackupDir">打开电脑上的备份文件夹</button>

    <div class="sheet-foot">
      <button class="btn" id="btnSyncNow">立即同步</button>
      <button class="btn primary" id="btnSaveSettings">保存并同步</button>

  </section>

  <!-- 冲突 -->

    <div class="sheet-head">
      <button class="icon-btn" id="btnCloseText" aria-label="返回">

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ================= 工具 ================= */
function $(s,r){ return (r||document).querySelector(s); }
function el(tag,cls,text){ var e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad(n){ return n<10?'0'+n:''+n; }
function fmtTime(ts){
  if(!ts) return '';
  var d=new Date(ts), n=new Date();
  var sameDay=d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
  var hm=pad(d.getHours())+':'+pad(d.getMinutes());
  if(sameDay) return hm;
  if(d.getFullYear()===n.getFullYear()) return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}
function stamp(){
  var d=new Date();
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());
}
function b64(str){
  var bytes=new TextEncoder().encode(str), bin='', CH=0x8000;
  for(var i=0;i<bytes.length;i+=CH) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(bin);
}
var PIN_SVG='<svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 3h6l-1 5 3.4 2.4a1 1 0 0 1 .43.83V13a1 1 0 0 1-1 1H7.17a1 1 0 0 1-1-1v-1.77a1 1 0 0 1 .43-.83L10 8 9 3z"/></svg>';

/* ================= 数据 ================= */
var LS_DATA='notes.data.v1', LS_CFG='notes.cfg.v1', LS_SYNC='notes.lastSync.v1', LS_BASE='notes.base.v1', LS_BK='notes.backup.v1';

var data={ notes:[], trash:[], gone:{} };
var cfg={ url:'https://dav.jianguoyun.com/dav/', user:'', pass:'', folder:'便签', file:'便签.json', auto:true, winOnTop:true, dockEnabled:true, autoStart:true, cfgVer:2 };
var edit={ noteId:null, childId:null };
var pending=null;
var syncing=false, lastSync=0, statusText='就绪';

function normalizeNotes(arr){
  return (Array.isArray(arr)?arr:[]).map(function(n){
    var c=Object.assign({},n);
    c.id=c.id||uid();
    c.text=c.text||'';
    c.pinned=!!c.pinned;
    c.createdAt=c.createdAt||Date.now();
    c.updatedAt=c.updatedAt||c.createdAt;
    c.children=Array.isArray(c.children)?c.children.map(function(k){
      return { id:k.id||uid(), text:k.text||'', done:!!k.done, updatedAt:k.updatedAt||c.updatedAt };
    }):[];
    return c;
  });
}

function loadLocal(){
  try{
    var d=JSON.parse(localStorage.getItem(LS_DATA)||'null');
    if(d&&typeof d==='object'){
      data.notes=normalizeNotes(d.notes);
      data.trash=normalizeNotes(d.trash);
      data.gone=(d.gone&&typeof d.gone==='object')?d.gone:{};
    }
  }catch(e){}
  try{
    var c=JSON.parse(localStorage.getItem(LS_CFG)||'null');
    if(c&&typeof c==='object'){ for(var k in cfg){ if(c[k]!==undefined) cfg[k]=c[k]; } }
    // 老配置升级：窗口置顶 + 开机自启改为默认开启（只迁移一次，之后尊重用户选择）
    if(!c || c.cfgVer!==2){
      cfg.winOnTop=true;
      cfg.autoStart=true;
      cfg.cfgVer=2;
      saveCfg();
    }
  }catch(e){}
  lastSync=Number(localStorage.getItem(LS_SYNC)||0)||0;
}
function saveLocal(){
  try{ localStorage.setItem(LS_DATA, JSON.stringify({notes:data.notes, trash:data.trash, gone:data.gone})); }catch(e){}
}
function saveCfg(){
  try{ localStorage.setItem(LS_CFG, JSON.stringify(cfg)); }catch(e){}
  try{ localStorage.setItem(LS_SYNC, String(lastSync)); }catch(e){}
}

/* ================= 渲染列表 ================= */
function render(){
  var list=$('#list');
  list.textContent='';

  var notes=data.notes.slice().sort(function(a,b){
    if(!!b.pinned!==!!a.pinned) return b.pinned?1:-1;
    return (b.createdAt||0)-(a.createdAt||0);
  });
  $('#empty').hidden=notes.length>0;
  notes.forEach(function(n){ list.appendChild(noteRow(n)); });

  $('#subtitle').textContent = davReady() ? (cfg.folder||'WebDAV') : '本地';
  $('#btnQuickSync').hidden = !davReady();
  $('#status').textContent = statusText;

  if(edit.noteId) focusEditor();
}

function focusEditor(){
  var ta=document.querySelector('#list textarea.edit, #list input.kedit');
  if(!ta) return;
  ta.focus();
  try{ ta.setSelectionRange(ta.value.length, ta.value.length); }catch(e){}
}

function noteRow(n){
  var row=el('div','row'+(n.pinned?' pinned':''));
  row.dataset.id=n.id;

  var kids=n.children||[];
  var doneCount=kids.filter(function(k){ return k.done; }).length;

  var chk=el('button','check');
  chk.type='button';
  if(kids.length && doneCount===kids.length) chk.classList.add('done');
  else if(doneCount>0) chk.classList.add('partial');
  chk.title = kids.length ? '打钩 → 整条（含子项）移入回收站' : '打钩 → 移入回收站';
  chk.setAttribute('aria-label','移入回收站');
  chk.addEventListener('click',function(e){ e.stopPropagation(); trashNote(n.id); });

  var body=el('div','body');

  if(edit.noteId===n.id && !edit.childId){
    var ta=el('textarea','edit');
    ta.value=n.text;
    ta.rows=1;
    var fired=false;
    function finish(andNew){
      if(fired) return; fired=true;
      commitNote(n.id, ta.value, andNew);
    }
    ta.addEventListener('input',function(){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; });
    ta.addEventListener('blur',function(){ finish(false); });
    ta.addEventListener('keydown',function(e){
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); finish(true); }
      else if(e.key==='Escape'){ e.preventDefault(); fired=true; edit={noteId:null,childId:null}; render(); }
    });
    body.appendChild(ta);
    setTimeout(function(){ ta.style.height=ta.scrollHeight+'px'; },0);
  }else{
    var t=el('div','note-text'+(kids.length?' head':''), n.text||'（空）');
    t.addEventListener('click',function(){ startEditNote(n.id); });
    body.appendChild(t);
  }

  if(kids.length || edit.noteId===n.id){
    var wrap=el('div','kids');
    kids.forEach(function(k){ wrap.appendChild(kidRow(n,k)); });
    body.appendChild(wrap);
  }

  var meta=fmtTime(n.createdAt);
  if(kids.length) meta='· '+doneCount+'/'+kids.length+' 子项 · '+meta;
  if(edit.noteId===n.id && !edit.childId) meta='回车 = 新增子项，Shift+回车 = 换行';
  var timeEl=el('div','note-time');
  timeEl.appendChild(el('span', edit.noteId===n.id&&!edit.childId?'tip':'', meta));
  body.appendChild(timeEl);

  var pin=el('button','pin'+(n.pinned?' on':''));
  pin.type='button';
  pin.title=n.pinned?'取消置顶':'置顶';
  pin.innerHTML=PIN_SVG;
  pin.addEventListener('click',function(e){ e.stopPropagation(); togglePin(n.id); });

  row.appendChild(chk);
  row.appendChild(body);
  row.appendChild(pin);
  return row;
}

function kidRow(n,k){
  var wrap=el('div','kid'+(k.done?' done':''));
  wrap.dataset.cid=k.id;

  var c=el('button','kcheck'+(k.done?' done':''));
  c.type='button';
  c.title=k.done?'取消打钩':'打钩';
  c.addEventListener('click',function(e){ e.stopPropagation(); toggleChild(n.id,k.id); });
  wrap.appendChild(c);

  if(edit.childId===k.id){
    var inp=document.createElement('input');
    inp.type='text';
    inp.className='kedit';
    inp.value=k.text;
    inp.placeholder='子项…（回车新增下一个）';
    var fired=false;
    function finish(andNew){
      if(fired) return; fired=true;
      commitChild(n.id, k.id, inp.value, andNew);
    }
    inp.addEventListener('blur',function(){ finish(false); });
    inp.addEventListener('keydown',function(e){
      if(e.key==='Enter'){ e.preventDefault(); finish(true); }
      else if(e.key==='Backspace' && inp.value===''){ e.preventDefault(); fired=true; removeChild(n.id,k.id); }
      else if(e.key==='Escape'){ e.preventDefault(); fired=true; edit={noteId:null,childId:null}; render(); }
    });
    wrap.appendChild(inp);
    setTimeout(function(){ inp.focus(); try{ inp.setSelectionRange(inp.value.length,inp.value.length); }catch(e){} },0);
  }else{
    var t=el('div','ktext', k.text||'（空）');
    t.addEventListener('click',function(){ startEditChild(n.id,k.id); });
    wrap.appendChild(t);
  }
  return wrap;
}

/* ================= 编辑 ================= */
function findNote(id){
  for(var i=0;i<data.notes.length;i++) if(data.notes[i].id===id) return data.notes[i];
  return null;
}
function findChild(n,cid){
  if(!n) return null;
  for(var i=0;i<n.children.length;i++) if(n.children[i].id===cid) return n.children[i];
  return null;
}
function startEditNote(id){ edit={noteId:id,childId:null}; render(); }
function startEditChild(id,cid){ edit={noteId:id,childId:cid}; render(); }

function commitNote(id,text,andNew){
  var n=findNote(id);
  edit={noteId:null,childId:null};
  if(!n){ render(); return; }
  var v=(text||'').replace(/\s+$/,'');
  if(v && v!==n.text){ n.text=v; n.updatedAt=Date.now(); }
  var child=null;
  if(andNew){
    var now=Date.now();
    child={ id:uid(), text:'', done:false, updatedAt:now };
    n.children.push(child);
    n.updatedAt=now;
  }
  saveLocal(); render();
  if(child){ edit={noteId:id,childId:child.id}; render(); }
  scheduleSync();
}

function commitChild(noteId,cid,text,andNew){
  var n=findNote(noteId);
  edit={noteId:null,childId:null};
  if(!n){ render(); return; }
  var k=findChild(n,cid);
  var v=(text||'').replace(/\s+$/,'');

  if(k){
    if(!v){
      // 清空即删除这个子项
      n.children=n.children.filter(function(x){ return x.id!==cid; });
      n.updatedAt=Date.now();
      saveLocal(); scheduleSync(); render(); return;
    }
    if(v!==k.text){
      k.text=v; k.updatedAt=Date.now(); n.updatedAt=k.updatedAt;
      saveLocal(); scheduleSync();
    }
  }

  if(andNew){
    var now=Date.now();
    var child={ id:uid(), text:'', done:false, updatedAt:now };
    var idx=-1;
    n.children.forEach(function(x,i){ if(x.id===cid) idx=i; });
    n.children.splice(idx<0?n.children.length:idx+1,0,child);
    n.updatedAt=now;
    saveLocal();
    edit={noteId:noteId,childId:child.id};
  }
  render();
}

function removeChild(noteId,cid){
  var n=findNote(noteId);
  edit={noteId:null,childId:null};
  if(!n){ render(); return; }
  n.children=n.children.filter(function(x){ return x.id!==cid; });
  n.updatedAt=Date.now();
  saveLocal(); scheduleSync(); render();
}

/* ================= 操作 ================= */
function addNote(){
  var input=$('#newInput');
  var v=(input.value||'').trim();
  if(!v){ input.focus(); return; }
  var now=Date.now();
  data.notes.push({ id:uid(), text:v, pinned:false, children:[], createdAt:now, updatedAt:now });
  input.value='';
  edit={noteId:null,childId:null};
  saveLocal(); render(); scheduleSync();
  $('#list').scrollTop=0;
  input.focus();
  backupMaybe();
}

function togglePin(id){
  var n=findNote(id);
  if(!n) return;
  n.pinned=!n.pinned;
  n.updatedAt=Date.now();
  saveLocal(); render(); scheduleSync();
  toast(n.pinned?'已置顶':'已取消置顶');
}

function toggleChild(noteId,cid){
  var n=findNote(noteId);
  if(!n) return;
  var k=findChild(n,cid);
  if(!k) return;
  k.done=!k.done;
  k.updatedAt=Date.now();
  n.updatedAt=k.updatedAt;
  saveLocal();
  render();
  var all=n.children.length>0 && n.children.every(function(x){ return x.done; });
  if(all){
    setTimeout(function(){
      var cur=findNote(noteId);
      if(cur && cur.children.length && cur.children.every(function(x){ return x.done; })) trashNote(noteId);
    },600);
  }
  scheduleSync();
}

function trashNote(id){
  var idx=-1;
  for(var i=0;i<data.notes.length;i++) if(data.notes[i].id===id){ idx=i; break; }
  if(idx<0) return;
  var n=data.notes.splice(idx,1)[0];
  n.deletedAt=Date.now();
  n.updatedAt=n.deletedAt;
  data.trash.push(n);
  if(edit.noteId===id) edit={noteId:null,childId:null};
  saveLocal(); render(); scheduleSync(); backupMaybe();
  var extra=(n.children&&n.children.length)?'（含 '+n.children.length+' 个子项）':'';
  toast('已移到回收站'+extra,'撤销',function(){ restoreNote(id); });
}

function restoreNote(id){
  var idx=-1;
  for(var i=0;i<data.trash.length;i++) if(data.trash[i].id===id){ idx=i; break; }
  if(idx<0){ renderTrash(); return; }
  var n=data.trash.splice(idx,1)[0];
  delete n.deletedAt;
  // 回到「未完成」状态
  (n.children||[]).forEach(function(k){ k.done=false; k.updatedAt=Date.now(); });
  n.updatedAt=Date.now();
  data.notes.push(n);
  saveLocal(); render(); renderTrash(); scheduleSync();
  toast('已放回列表（未完成状态）');
}

function purgeNote(id){
  for(var i=0;i<data.trash.length;i++){
    if(data.trash[i].id===id){
      data.trash.splice(i,1);
      data.gone[id]=Date.now();
      break;
    }
  }
  saveLocal(); render(); renderTrash(); scheduleSync();
}

function purgeAll(){
  if(!data.trash.length) return;
  var now=Date.now();
  data.trash.forEach(function(n){ data.gone[n.id]=now; });
  data.trash=[];
  saveLocal(); render(); renderTrash(); scheduleSync();
}

/* ================= 回收站 ================= */
function renderTrash(){
  var box=$('#trashList');
  box.textContent='';
  $('#trashHint').hidden=data.trash.length===0;
  if(!data.trash.length){
    box.appendChild(el('div','empty','回收站是空的'));
    return;
  }
  var items=data.trash.slice().sort(function(a,b){ return (b.deletedAt||0)-(a.deletedAt||0); });
  items.forEach(function(n){
    var row=el('div','trow');

    var chk=el('button','check done');
    chk.type='button';
    chk.title='点一下取消打钩 → 放回列表（未完成）';
    chk.addEventListener('click',function(){ restoreNote(n.id); });

    var left=el('div','');
    left.style.flex='1'; left.style.minWidth='0';
    left.appendChild(el('div','t-text', n.text||'（空）'));
    var kids=n.children||[];
    if(kids.length){
      left.appendChild(el('div','t-time', kids.length+' 个子项（'+kids.filter(function(k){return k.done;}).length+' 已完成）'));
    }
    left.appendChild(el('div','t-time','删除于 '+fmtTime(n.deletedAt||n.updatedAt)));

    var del=el('button','mini red','删除');
    del.type='button';
    del.addEventListener('click',function(){ purgeNote(n.id); });

    row.appendChild(chk); row.appendChild(left); row.appendChild(del);
    box.appendChild(row);
  });
}

/* ================= 提示条 ================= */
var toastTimer=null;
function toast(msg, actionLabel, actionFn){
  var t=$('#toast');
  t.textContent='';
  t.appendChild(el('span','',msg));
  if(actionLabel){
    var b=el('button','act',actionLabel);
    b.type='button';
    b.addEventListener('click',function(){ hideToast(); if(actionFn) actionFn(); });
    t.appendChild(b);
  }
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(hideToast,3800);
}
function hideToast(){ $('#toast').classList.remove('show'); }

/* ================= 文件保存 ================= */
async function saveFile(name,text){
  // 1) Windows(Electron)：弹系统保存对话框
  if(window.notesNative && window.notesNative.saveFile){
    try{
      var r=await window.notesNative.saveFile({ name:name, text:text });
      if(r && r.ok){ toast('已保存：'+r.path); return true; }
      if(r && r.canceled) return false;
    }catch(e){}
  }
  // 2) 安卓(Capacitor)：写入文档目录
  var Cap=window.Capacitor;
  if(Cap && Cap.Plugins && Cap.Plugins.Filesystem){
    try{
      await Cap.Plugins.Filesystem.writeFile({ path:name, data:b64(text), directory:'DOCUMENTS', recursive:true });
      toast('已保存到手机「文档」目录：'+name);
      return true;
    }catch(e){}
  }
  // 3) 浏览器下载
  try{
    var blob=new Blob([text],{type:'application/json;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },2000);
    toast('已导出：'+name);
    return true;
  }catch(e){}
  // 4) 兜底：显示出来手动复制
  showText(name,text);
  return false;
}

function showText(title,text){
  $('#textTitle').textContent=title||'内容';
  $('#textOut').value=text;
  $('#sheetText').hidden=false;
  setTimeout(function(){
    var t=$('#textOut');
    t.focus(); t.select();
  },50);
}

/* ================= 本地备份 ================= */
function loadBackups(){
  try{ var a=JSON.parse(localStorage.getItem(LS_BK)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; }
}
var lastBackupAt=0;
function backupNow(silent,force){
  var doc=exportDoc();
  var list=loadBackups();
  if(!force && list.length && docSig(list[0].doc)===docSig(doc)){
    lastBackupAt=Date.now(); renderBackupState();
    return doc;
  }
  list.unshift({ at:Date.now(), doc:doc });
  list=list.slice(0,3);
  try{ localStorage.setItem(LS_BK, JSON.stringify(list)); }catch(e){}
  lastBackupAt=Date.now();
  // Windows：同时写一份真实文件到用户数据目录
  if(window.notesNative && window.notesNative.localBackup){
    try{ window.notesNative.localBackup({ name:'便签备份-'+stamp()+'.json', text:JSON.stringify(doc) }); }catch(e){}
  }
  renderBackupState();
  if(!silent) toast('已备份到本地');
  return doc;
}
function backupMaybe(){
  var gap=10*60*1000;
  if(Date.now()-lastBackupAt>gap){ backupNow(true); }
}
function renderBackupState(){
  var list=loadBackups();
  var box=$('#backupState');
  if(!box) return;
  if(!list.length){ box.textContent='还没有本地备份'; }
  else{
    box.textContent='最近备份：'+fmtTime(list[0].at)+'（共保留 '+list.length+' 份快照在设备本地）'+
      (window.notesNative?'，电脑上另存于「备份文件夹」':'');
  }
}
function restoreBackup(){
  var list=loadBackups();
  if(!list.length){ toast('还没有本地备份'); return; }
  if(!confirm('用 '+fmtTime(list[0].at)+' 的本地备份覆盖当前数据？当前数据会先存一份快照。')) return;
  backupNow(true);
  applyDoc(list[0].doc);
  saveLocal(); render(); renderTrash();
  toast('已从本地备份恢复');
}

/* ================= WebDAV ================= */
function davReady(){ return !!(cfg.url && cfg.user && cfg.pass); }
function baseUrl(){ return String(cfg.url||'').trim().replace(/\/+$/,'')+'/'; }
function folderSegs(){ return String(cfg.folder||'').split('/').map(function(s){ return s.trim(); }).filter(Boolean); }
function folderUrl(){
  var p=folderSegs();
  return baseUrl()+(p.length?p.map(encodeURIComponent).join('/')+'/':'');
}
function fileUrl(){
  var name=String(cfg.file||'便签.json').trim()||'便签.json';
  return folderUrl()+encodeURIComponent(name);
}
function basicAuth(){
  var s=cfg.user+':'+cfg.pass, bin='';
  var bytes=new TextEncoder().encode(s);
  for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return 'Basic '+btoa(bin);
}
function statusMsg(code){
  var m={0:'网络不可达',401:'账号或密码错误（坚果云要用应用密码）',403:'没有权限访问该目录',
    404:'文件或目录不存在',405:'服务器不支持该操作',409:'同步目录不存在，请先在网盘里建好这个目录',
    423:'文件被锁定，稍后再试',507:'网盘空间不足'};
  return m[code]||('HTTP '+code);
}

function dav(method,url,body){
  var headers={ Authorization:basicAuth() };
  if(body!=null) headers['Content-Type']='application/json; charset=utf-8';

  if(window.notesNative && typeof window.notesNative.dav==='function'){
    return window.notesNative.dav({ url:url, method:method, headers:headers, body:body==null?null:body });
  }
  var Cap=window.Capacitor;
  if(Cap && Cap.Plugins && Cap.Plugins.CapacitorHttp){
    return Cap.Plugins.CapacitorHttp.request({
      url:url, method:method, headers:headers,
      data: body==null?undefined:body,
      responseType:'text', connectTimeout:20000, readTimeout:30000
    }).then(function(res){
      var text=res.data;
      if(typeof text!=='string') text=text==null?'':JSON.stringify(text);
      return { status:res.status, text:text };
    }).catch(function(){ return fetchDav(method,url,body,headers); });
  }
  return fetchDav(method,url,body,headers);
}
function fetchDav(method,url,body,headers){
  return fetch(url,{ method:method, headers:headers, body:(body==null?undefined:body) })
    .then(function(r){ return r.text().then(function(t){ return { status:r.status, text:t }; }); });
}
function ensureFolder(){
  var p=folderSegs();
  if(!p.length) return Promise.resolve();
  var acc=baseUrl(), chain=Promise.resolve();
  p.forEach(function(seg){
    acc+=encodeURIComponent(seg)+'/';
    var target=acc;
    chain=chain.then(function(){ return dav('MKCOL',target); }).catch(function(){});
  });
  return chain;
}

var syncTimer=null;
function scheduleSync(){
  if(!cfg.auto || !davReady() || pending) return;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){
    if(edit.noteId){ scheduleSync(); return; }   // 正在编辑，等编辑结束再传
    sync({auto:true});
  },2500);
}
function setStatus(t){ statusText=t; var s=$('#status'); if(s) s.textContent=t; }

/* ---------- 文档 <-> 规范化记录 ---------- */
function exportDoc(){
  pruned();
  var o={ v:3, updatedAt:Date.now(), notes:data.notes, trash:data.trash, gone:data.gone };
  return JSON.parse(JSON.stringify(o));
}
function applyDoc(d){
  data.notes=normalizeNotes(d&&d.notes);
  data.trash=normalizeNotes(d&&d.trash);
  data.gone=(d&&d.gone&&typeof d.gone==='object')?d.gone:{};
  pruned();
  edit={noteId:null,childId:null};
}
function pruned(){
  var limit=Date.now()-90*24*3600*1000;
  for(var k in data.gone){ if(!(data.gone[k]>limit)) delete data.gone[k]; }
}
function canonMap(doc){
  var m={};
  if(!doc) return m;
  (doc.notes||[]).forEach(function(n){
    if(!n||!n.id) return;
    var c=Object.assign({},n);
    delete c.deletedAt;
    c.children=Array.isArray(c.children)?c.children:[];
    m[c.id]=c;
  });
  (doc.trash||[]).forEach(function(n){
    if(!n||!n.id) return;
    var c=Object.assign({},n);
    c.children=Array.isArray(c.children)?c.children:[];
    if(!c.deletedAt) c.deletedAt=c.updatedAt||Date.now();
    var cur=m[c.id];
    if(!cur||(c.updatedAt||0)>=(cur.updatedAt||0)) m[c.id]=c;
  });
  var g=doc.gone||{};
  for(var id in g){
    var t=g[id]||0, cur2=m[id];
    if(!cur2||t>(cur2.updatedAt||0)) m[id]={ id:id, gone:true, updatedAt:t };
  }
  return m;
}
function docFromMap(m){
  var notes=[], trash=[], gone={};
  for(var id in m){
    var r=m[id];
    if(r.gone){ gone[id]=r.updatedAt||Date.now(); continue; }
    if(r.deletedAt) trash.push(r); else notes.push(r);
  }
  return { v:3, updatedAt:Date.now(), notes:notes, trash:trash, gone:gone };
}
function sortKeys(o){
  if(Array.isArray(o)) return o.map(sortKeys);
  if(o&&typeof o==='object'){ var r={}; Object.keys(o).sort().forEach(function(k){ r[k]=sortKeys(o[k]); }); return r; }
  return o;
}
function sig(x){ return x==null?'#':JSON.stringify(sortKeys(x)); }
function docSig(d){ return sig({ notes:(d&&d.notes)||[], trash:(d&&d.trash)||[], gone:(d&&d.gone)||{} }); }

function mergeNewer(l,r){
  var m={};
  for(var id in r) m[id]=r[id];
  for(var id2 in l){
    var a=l[id2];
    if(!m[id2] || (a.updatedAt||0)>(m[id2].updatedAt||0)) m[id2]=a;
  }
  return m;
}
function threeWay(localM,remoteM,baseM){
  var ids={}, merged={}, conflicts=[];
  [localM,remoteM,baseM].forEach(function(m){ for(var id in m) ids[id]=1; });
  for(var id in ids){
    var L=localM[id]||null, R=remoteM[id]||null, B=baseM[id]||null;
    var pick;
    if(sig(L)===sig(R)) pick=L;
    else if(sig(L)===sig(B)) pick=R;
    else if(sig(R)===sig(B)) pick=L;
    else { conflicts.push({ id:id, local:L, remote:R }); continue; }
    if(pick) merged[id]=pick;
  }
  return { merged:merged, conflicts:conflicts };
}

function loadBase(){ try{ return JSON.parse(localStorage.getItem(LS_BASE)||'null'); }catch(e){ return null; } }
function saveBase(doc){ try{ localStorage.setItem(LS_BASE, JSON.stringify({ notes:doc.notes, trash:doc.trash, gone:doc.gone })); }catch(e){} }

/* ---------- 同步 ---------- */
async function sync(opts){
  opts=opts||{};
  if(syncing) return;
  if(pending){ if(opts.manual) toast('先处理同步冲突'); return; }
  if(!davReady()){
    setStatus('未配置 WebDAV');
    if(opts.manual) openSettings();
    return;
  }
  syncing=true;
  setStatus('同步中…');
  $('#btnSyncNow').disabled=true;
  try{
    var url=fileUrl();
    var remoteDoc=null;

    var r=await dav('GET',url);
    if(r.status===200&&r.text&&r.text.trim()){
      try{ remoteDoc=JSON.parse(r.text); }catch(e){ remoteDoc=null; }
    }else if(r.status===404){
      remoteDoc=null;
    }else if(r.status===409){
      await ensureFolder();
      r=await dav('GET',url);
      if(r.status===200){ try{ remoteDoc=JSON.parse(r.text||'null'); }catch(e){} }
      else if(r.status!==404) throw new Error(statusMsg(r.status));
    }else if(r.status!==204){
      throw new Error(statusMsg(r.status));
    }

    var localDoc=exportDoc();
    var localM=canonMap(localDoc);
    var remoteM=remoteDoc?canonMap(remoteDoc):null;
    var baseDoc=loadBase();

    var result;
    if(!remoteM) result={ merged:localM, conflicts:[] };
    else if(!baseDoc) result={ merged:mergeNewer(localM,remoteM), conflicts:[] };
    else result=threeWay(localM,remoteM,canonMap(baseDoc));

    if(result.conflicts.length){
      pending={ merged:result.merged, conflicts:result.conflicts, localDoc:localDoc, remoteDoc:remoteDoc, choices:{} };
      result.conflicts.forEach(function(c){
        var lt=c.local?(c.local.updatedAt||0):0, rt=c.remote?(c.remote.updatedAt||0):0;
        pending.choices[c.id]= lt>=rt?'local':'remote';
      });
      setStatus('发现 '+result.conflicts.length+' 条冲突，待处理');
      openConflict();
      return;
    }

    if(remoteDoc) backupNow(true);   // 合并前先把本地状态留一份
    var doc=docFromMap(result.merged);
    applyDoc(doc);
    saveLocal();
    await pushDoc(doc,remoteDoc);
    setStatus('已同步 '+fmtTime(lastSync));
  }catch(err){
    var msg=(err&&err.message)?err.message:String(err);
    setStatus('同步失败：'+msg);
    $('#syncState').textContent='同步失败：'+msg;
    if(opts.manual) toast('同步失败：'+msg);
  }finally{
    syncing=false;
    $('#btnSyncNow').disabled=false;
  }
}

async function pushDoc(doc,remoteDoc){
  var need=!remoteDoc || docSig(doc)!==docSig(remoteDoc);
  if(need){
    var put=await dav('PUT',fileUrl(),JSON.stringify(doc));
    if([200,201,204].indexOf(put.status)<0) throw new Error('上传失败：'+statusMsg(put.status));
  }
  saveBase(doc);
  lastSync=Date.now();
  saveCfg();
  $('#syncState').textContent='上次同步：'+fmtTime(lastSync)+(need?'（已上传）':'（已是最新）');
}

/* ---------- 冲突面板 ---------- */
function openConflict(){
  renderConflict();
  $('#sheetConflict').hidden=false;
  render();
}
function recSummary(rec){
  if(!rec) return '（这边没有这条）';
  if(rec.gone) return '（这边已彻底删除）';
  var s=(rec.deletedAt?'[回收站] ':'')+(rec.text||'（空）');
  var kids=rec.children||[];
  if(kids.length){
    s+='\n'+kids.map(function(k){ return (k.done?'✓ ':'· ')+k.text; }).join('\n');
  }
  return s;
}
function renderConflict(){
  var box=$('#conflictList');
  box.textContent='';
  if(!pending){ return; }
  box.appendChild(el('p','hint','这些便签在本地和云端都被改过。点一个版本作为保留结果（不点默认选较新的），也可以用下面按钮把两份都导出成文件自己看。'));
  pending.conflicts.forEach(function(c){
    var card=el('div','cf');
    var head=el('div','cf-head', (c.local&&c.local.text)||(c.remote&&c.remote.text)||'（这条被删除）');
    card.appendChild(head);
    card.appendChild(sideEl('local',c));
    card.appendChild(sideEl('remote',c));
    box.appendChild(card);
  });
}
function sideEl(kind,c){
  var rec=kind==='local'?c.local:c.remote;
  var d=el('div','cf-side'+(pending.choices[c.id]===kind?' sel':''));
  d.appendChild(el('div','cf-label', kind==='local'?'本地版本':'云端版本'));
  d.appendChild(el('div','cf-text', recSummary(rec)));
  d.appendChild(el('div','cf-time', rec?fmtTime(rec.updatedAt||rec.deletedAt):'—'));
  d.addEventListener('click',function(){ pending.choices[c.id]=kind; renderConflict(); });
  return d;
}
function resolveConflicts(choice){
  if(!pending) return;
  var m=pending.merged;
  var localM=canonMap(pending.localDoc);
  var remoteM=canonMap(pending.remoteDoc);
  pending.conflicts.forEach(function(c){
    var side=choice||pending.choices[c.id]||'local';
    var pick=side==='local'?localM[c.id]:remoteM[c.id];
    if(pick) m[c.id]=pick; else delete m[c.id];
  });
  var doc=docFromMap(m);
  var remoteDoc=pending.remoteDoc;
  pending=null;
  $('#sheetConflict').hidden=true;
  applyDoc(doc);
  saveLocal(); render();
  setStatus('正在上传合并结果…');
  pushDoc(doc,remoteDoc).then(function(){
    setStatus('已同步 '+fmtTime(lastSync));
    toast('冲突已解决');
  }).catch(function(err){
    setStatus('上传失败：'+((err&&err.message)||err));
    toast('上传失败：'+((err&&err.message)||err));
  });
}
async function exportConflictFiles(){
  if(!pending) return;
  var s=stamp();
  await saveFile('便签-本地-'+s+'.json', JSON.stringify(pending.localDoc,null,2));
  await saveFile('便签-云端-'+s+'.json', JSON.stringify(pending.remoteDoc,null,2));
}

/* ================= 设置 ================= */
function openSettings(){
  $('#cfgUrl').value=cfg.url||'';
  $('#cfgUser').value=cfg.user||'';
  $('#cfgPass').value=cfg.pass||'';
  $('#cfgFolder').value=cfg.folder||'';
  $('#cfgFile').value=cfg.file||'便签.json';
  $('#cfgAuto').checked=!!cfg.auto;
  $('#syncState').textContent = lastSync?('上次同步：'+fmtTime(lastSync)):'尚未同步';
  renderBackupState();
  $('#winSettings').hidden = !winApi();
  if(window.notesNative && window.notesNative.autoStart){
    window.notesNative.autoStart.state().then(function(s){
      if(!s || !s.supported){ $('#rowAutoStart').hidden=true; return; }
      $('#rowAutoStart').hidden=false;
      $('#cfgAutoStart').checked=!!s.enabled;
    }).catch(function(){});
  }
  if(winState){
    $('#cfgWinTop').checked=!!winState.alwaysOnTop;
    $('#cfgDock').checked=!!winState.dockEnabled;
  }
  $('#rowBackupDir').hidden = !(window.notesNative && window.notesNative.openBackupDir);
  $('#sheetSettings').hidden=false;
}
function saveSettings(){
  cfg.url=$('#cfgUrl').value.trim();
  cfg.user=$('#cfgUser').value.trim();
  cfg.pass=$('#cfgPass').value;
  cfg.folder=$('#cfgFolder').value.trim();
  cfg.file=$('#cfgFile').value.trim()||'便签.json';
  cfg.auto=$('#cfgAuto').checked;
  saveCfg();
  render();
  $('#sheetSettings').hidden=true;
  if(davReady()){ toast('设置已保存'); sync({manual:true}); }
  else toast('设置已保存（同步信息还没填完）');
}

/* ================= 电脑端窗口（置顶 / 贴边收起） ================= */
var winState=null;
function winApi(){ return window.notesNative && window.notesNative.win ? window.notesNative.win : null; }

function applyWinState(s){
  if(!s) return;
  winState=s;
  document.documentElement.classList.toggle('collapsed',!!s.docked);
  var pin=$('#btnWinPin');
  if(pin){
    pin.classList.toggle('active',!!s.alwaysOnTop);
    pin.title=s.alwaysOnTop?'取消窗口置顶':'窗口置顶';
  }
  var sw=$('#cfgWinTop'); if(sw) sw.checked=!!s.alwaysOnTop;
  var sw2=$('#cfgDock'); if(sw2) sw2.checked=!!s.dockEnabled;
}

function initDesktop(){
  var W=winApi();
  if(!W) return;
  document.documentElement.classList.add('desktop');
  $('#winbar').hidden=false;
  $('#winSettings').hidden=false;

  W.onState(function(s){ applyWinState(s); });
  if(W.state) W.state().then(applyWinState).catch(function(){});
  W.setAlwaysOnTop(!!cfg.winOnTop);
  W.setDock(cfg.dockEnabled!==false);

  $('#btnWinPin').addEventListener('click',function(){
    var v=!(winState&&winState.alwaysOnTop);
    cfg.winOnTop=v; saveCfg();
    W.setAlwaysOnTop(v).then(applyWinState).catch(function(){});
    toast(v?'窗口已置顶':'已取消窗口置顶');
  });
  $('#btnWinMin').addEventListener('click',function(){ W.minimize(); });
  $('#btnWinClose').addEventListener('click',function(){ W.close(); });
  $('#btnWinCollapse').addEventListener('click',function(){ if(W.collapse) W.collapse(); });

  $('#cfgWinTop').addEventListener('change',function(){
    cfg.winOnTop=this.checked; saveCfg();
    W.setAlwaysOnTop(this.checked).then(applyWinState).catch(function(){});
  });
  $('#cfgDock').addEventListener('change',function(){
    cfg.dockEnabled=this.checked; saveCfg();
    W.setDock(this.checked).then(applyWinState).catch(function(){});
  });

  // 开机自动启动（首次运行默认打开）
  var AS=window.notesNative.autoStart;
  if(AS){
    AS.state().then(function(s){
      if(!s || !s.supported){ $('#rowAutoStart').hidden=true; return; }
      $('#cfgAutoStart').checked=!!s.enabled;
    }).catch(function(){});
    AS.set(cfg.autoStart!==false).catch(function(){});
    $('#cfgAutoStart').addEventListener('change',function(){
      cfg.autoStart=this.checked; saveCfg();
      var on=this.checked;
      AS.set(on).then(function(s){
        if(s && s.supported) $('#cfgAutoStart').checked=!!s.enabled;
        toast(on?'已设为开机自动启动':'已取消开机自动启动');
      }).catch(function(){});
    });
  }

  // 收起状态下点一下细条就滑出（主进程带防抖，刚收起时的误触会被忽略）
  document.addEventListener('click',function(){ if(winState&&winState.docked) W.expand(); },true);
}

/* ================= 事件 ================= */
function bind(){
  $('#btnAdd').addEventListener('click',addNote);
  $('#newInput').addEventListener('keydown',function(e){
    if(e.key==='Enter'){ e.preventDefault(); addNote(); }
  });

  $('#btnSettings').addEventListener('click',openSettings);
  $('#btnCloseSettings').addEventListener('click',function(){ $('#sheetSettings').hidden=true; });
  $('#btnSaveSettings').addEventListener('click',saveSettings);
  $('#btnSyncNow').addEventListener('click',function(){ sync({manual:true}); });
  $('#btnQuickSync').addEventListener('click',function(){ sync({manual:true}); });

  $('#btnBackupNow').addEventListener('click',function(){ backupNow(false); });
  $('#btnBackupExport').addEventListener('click',function(){
    saveFile('便签备份-'+stamp()+'.json', JSON.stringify(exportDoc(),null,2));
  });
  $('#btnBackupRestore').addEventListener('click',restoreBackup);
  $('#btnBackupDir').addEventListener('click',function(){
    if(window.notesNative && window.notesNative.openBackupDir) window.notesNative.openBackupDir();
  });

  $('#btnTrash').addEventListener('click',function(){ renderTrash(); $('#sheetTrash').hidden=false; });
  $('#btnCloseTrash').addEventListener('click',function(){ $('#sheetTrash').hidden=true; });
  $('#btnEmptyTrash').addEventListener('click',function(){
    if(!data.trash.length) return;
    if(confirm('清空回收站？删除后无法恢复（其它设备同步后也会消失）')) purgeAll();
  });

  $('#btnCloseConflict').addEventListener('click',function(){
    $('#sheetConflict').hidden=true;
    setStatus(pending?('有 '+pending.conflicts.length+' 条冲突待处理'):'就绪');
  });
  $('#btnConflictLocal').addEventListener('click',function(){ resolveConflicts('local'); });
  $('#btnConflictRemote').addEventListener('click',function(){ resolveConflicts('remote'); });
  $('#btnConflictExport').addEventListener('click',function(){ exportConflictFiles(); });
  $('#btnConflictDone').addEventListener('click',function(){ resolveConflicts(null); });

  $('#btnCloseText').addEventListener('click',function(){ $('#sheetText').hidden=true; });
  $('#btnCopyText').addEventListener('click',function(){
    var t=$('#textOut');
    t.focus(); t.select();
    try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('请手动复制'); }
  });

  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if(!$('#sheetText').hidden){ $('#sheetText').hidden=true; return; }
    if(!$('#sheetConflict').hidden){ $('#sheetConflict').hidden=true; return; }
    if(!$('#sheetTrash').hidden){ $('#sheetTrash').hidden=true; return; }
    if(!$('#sheetSettings').hidden){ $('#sheetSettings').hidden=true; return; }
  });

  document.addEventListener('visibilitychange',function(){
    if(!document.hidden && cfg.auto && davReady() && !pending && Date.now()-lastSync>5*60*1000) sync();
  });


}

/* ================= 启动 ================= */
loadLocal();
bind();
initDesktop();
render();
renderBackupState();
setTimeout(function(){
  if(davReady()){
    setStatus(lastSync?('已同步 '+fmtTime(lastSync)):'尚未同步');
    if(cfg.auto) sync({auto:true});
  }else{
    setStatus('本地存储');
  }
  backupMaybe();
},700);

})();

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查仓库文件
        run: |
          echo "===== 仓库根目录 ====="
          ls -la
          echo "===== 环境 ====="
          node -v
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "===== 必需文件自检 ====="
          miss=0
          for f in package.json capacitor.config.json www/index.html; do
            if [ -f "$f" ]; then echo "OK   $f"; else echo "MISSING   $f"; miss=1; fi
          done
          if [ "$miss" = "1" ]; then
            echo "::error::仓库根目录缺少上面标 MISSING 的文件，请把它们上传到仓库根目录"
            exit 1
          fi

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成 / 更新 android 工程
        run: |
          if [ -d android ]; then
            npx cap sync android
          else
            npx cap add android
          fi

      - name: 配置固定签名
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::没有配置 KEYSTORE_BASE64 这个 Secret，本次用默认 debug 签名，装不上旧版（下次配好就能覆盖安装了）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/biji.keystore
          cp signing.gradle android/app/signing.gradle
          printf '\napply from: "signing.gradle"\n' >> android/app/build.gradle
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.1.1"/' android/app/build.gradle
          echo "===== 版本与签名确认 ====="
          grep -n 'versionCode\|versionName' android/app/build.gradle || true
          keytool -list -keystore android/app/biji.keystore -storepass "BijiKs-2026-Note" | head -5

      - name: 构建 debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 显示 APK 签名指纹
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: biji-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
